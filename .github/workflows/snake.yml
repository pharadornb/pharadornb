# Copy to pharadornb/pharadornb as .github/workflows/snake.yml
# Generates the contribution snake SVGs and pushes them to the `output` branch.
name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1d4ed8&color_dots=#ebedf0,#bfdbfe,#93c5fd,#3b82f6,#1d4ed8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#60a5fa&color_dots=#161b22,#1e3a8a,#1d4ed8,#3b82f6,#93c5fd

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
